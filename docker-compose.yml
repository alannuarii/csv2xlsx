services:
  csv2xlsx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csv2xlsx-app
    restart: always
    ports:
      - "3021:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
